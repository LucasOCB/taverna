<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1c120a">
<title>Quadro de Missões</title>
<link rel="icon" href="assets/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- PORTÃO -->
<main id="portao" class="tela">
  <form id="form-portao" class="rolo rolo-portao" autocomplete="off">
    <img class="selo-portao" src="assets/selo.webp" alt="">
    <h1 class="titulo-rolo">Quadro de Missões</h1>
    <p class="fala">Alto lá, viajante. Diga as palavras de passagem.</p>
    <input id="frase" type="password" placeholder="as palavras secretas…" autocomplete="current-password" required>
    <label class="lembrar"><input id="lembrar" type="checkbox" checked> Lembrar neste aparelho</label>
    <button class="botao" type="submit">Entrar na taverna</button>
    <p id="erro-portao" class="erro" role="alert"></p>
  </form>
</main>

<!-- QUADRO -->
<div id="quadro" class="tela" hidden>
  <header class="topo">
    <div class="placa">
      <h1>Quadro de Missões</h1>
      <p id="saudacao"></p>
    </div>
    <button id="sair" class="botao-pequeno" type="button" title="Sair">Sair da taverna</button>
  </header>

  <nav class="abas" role="tablist">
    <button class="aba ativa" data-aba="quadro" role="tab">No quadro <span></span></button>
    <button class="aba" data-aba="jornada" role="tab">Em jornada <span></span></button>
    <button class="aba" data-aba="concluidas" role="tab">Concluídas <span></span></button>
  </nav>

  <section id="lista" class="lista" aria-live="polite"></section>

  <button id="nova" class="botao botao-flutuante" type="button" hidden>📜 Lançar missão</button>
</div>

<!-- NOVA MISSÃO -->
<dialog id="dlg-nova" class="dialogo">
  <form id="form-nova" class="rolo" method="dialog">
    <h2 class="titulo-rolo">Nova Missão</h2>
    <label>Missão
      <input name="titulo" maxlength="120" required placeholder="Ex.: Resgatar a encomenda dos Correios">
    </label>
    <label>O que o herói deve fazer
      <textarea name="descricao" rows="5" maxlength="4000" placeholder="Detalhes, lugar, o que trazer…"></textarea>
    </label>
    <fieldset class="raridades">
      <legend>Raridade</legend>
      <label class="r-comum"><input type="radio" name="raridade" value="comum" checked><span>Comum</span></label>
      <label class="r-rara"><input type="radio" name="raridade" value="rara"><span>Rara</span></label>
      <label class="r-epica"><input type="radio" name="raridade" value="epica"><span>Épica</span></label>
      <label class="r-lendaria"><input type="radio" name="raridade" value="lendaria"><span>Lendária</span></label>
    </fieldset>
    <div class="duas">
      <label>Recompensa
        <input name="recompensa" maxlength="140" placeholder="Ex.: um beijo e um café">
      </label>
      <label>Prazo
        <input name="prazo" type="date">
      </label>
    </div>
    <div class="acoes">
      <button class="botao-pequeno" value="cancelar" formnovalidate>Cancelar</button>
      <button class="botao" value="enviar" id="btn-enviar">Selar e enviar</button>
    </div>
    <p class="erro" id="erro-nova" role="alert"></p>
  </form>
</dialog>

<!-- DETALHE -->
<dialog id="dlg-detalhe" class="dialogo">
  <article class="rolo" id="detalhe"></article>
</dialog>

<!-- SELO ENVIADO -->
<div id="carimbo" class="carimbo" hidden>
  <img src="assets/selo.webp" alt="">
  <p>Missão selada e enviada ao herói</p>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
