<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0b09">
<title>Quadro de Missões</title>
<link rel="icon" href="assets/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Grenze+Gotisch:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="preload" href="assets/papel-a.webp" as="image">
<link rel="stylesheet" href="estilo.css">
</head>
<body class="no-portao">

<canvas id="brasas" aria-hidden="true"></canvas>
<button id="som" class="som" type="button" aria-label="Som ligado" aria-pressed="true">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path class="falante" d="M4 9h4l5-4v14l-5-4H4z"/><path class="ondas" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="mudo" d="M16 9l6 6M22 9l-6 6"/></svg>
</button>

<!-- PORTÃO -->
<main id="portao" class="portao">
  <button id="lacre" class="lacre" type="button">
    <img src="assets/lacrado.webp" alt="Pergaminho lacrado">
    <span>Toque no lacre</span>
  </button>

  <div id="carta" class="carta" hidden>
    <img class="cilindro" src="assets/cilindro.webp" alt="">
    <div class="carta-papel folha">
      <p class="ornamento" aria-hidden="true"><i></i><b></b><i></i></p>
      <h1 class="carta-titulo" data-pena>Quadro de Missões</h1>
      <p class="carta-fala" id="carta-fala" data-pena>Alto lá, viajante. Diga as palavras de passagem.</p>
      <form id="form-portao" class="surge" autocomplete="off">
        <input id="frase" type="password" placeholder="as palavras secretas" autocomplete="current-password" required>
        <label class="lembrar"><input id="lembrar" type="checkbox" checked> Lembrar neste aparelho</label>
        <button class="botao" type="submit">Entrar</button>
        <p id="erro-portao" class="erro" role="alert"></p>
      </form>
      <div id="bem-vinda" class="surge" hidden>
        <button class="botao" id="ver-quadro" type="button">Ver o quadro</button>
        <button class="link" id="trocar" type="button">não sou eu</button>
      </div>
    </div>
  </div>
</main>

<!-- QUADRO -->
<div id="quadro" class="quadro" hidden>
  <header class="topo">
    <p class="ornamento" aria-hidden="true"><i></i><b></b><i></i></p>
    <h1>Quadro de Missões</h1>
    <p id="saudacao" class="saudacao"></p>
    <button id="sair" class="link sair" type="button">sair</button>
  </header>

  <nav class="abas" role="tablist">
    <button class="aba ativa" data-aba="quadro" role="tab">No quadro <span></span></button>
    <button class="aba" data-aba="jornada" role="tab">Em jornada <span></span></button>
    <button class="aba" data-aba="concluidas" role="tab">Concluídas <span></span></button>
  </nav>

  <section id="lista" class="lista" aria-live="polite"></section>

  <button id="nova" class="botao botao-flutuante" type="button" hidden>Pregar nova missão</button>
</div>

<!-- NOVA MISSÃO -->
<dialog id="dlg-nova" class="dialogo">
  <form id="form-nova" class="folha" method="dialog">
    <h2 class="folha-titulo" data-pena>Nova missão</h2>
    <label>Missão
      <input name="titulo" maxlength="120" required placeholder="Resgatar a encomenda dos Correios">
    </label>
    <label>O que o herói deve fazer
      <textarea name="descricao" rows="4" maxlength="4000" placeholder="Detalhes, lugar, o que trazer"></textarea>
    </label>
    <fieldset class="raridades">
      <legend>Raridade</legend>
      <label class="r-comum"><input type="radio" name="raridade" value="comum" checked><span>Comum</span></label>
      <label class="r-rara"><input type="radio" name="raridade" value="rara"><span>Rara</span></label>
      <label class="r-epica"><input type="radio" name="raridade" value="epica"><span>Épica</span></label>
      <label class="r-lendaria"><input type="radio" name="raridade" value="lendaria"><span>Lendária</span></label>
    </fieldset>
    <div class="duas">
      <label>Recompensa
        <input name="recompensa" maxlength="140" placeholder="Um beijo e um café">
      </label>
      <label>Prazo
        <input name="prazo" type="date">
      </label>
    </div>
    <div class="acoes">
      <button class="link" value="cancelar" formnovalidate>cancelar</button>
      <button class="botao" value="enviar" id="btn-enviar">Selar e pregar</button>
    </div>
    <p class="erro" id="erro-nova" role="alert"></p>
  </form>
</dialog>

<!-- DETALHE -->
<dialog id="dlg-detalhe" class="dialogo">
  <article class="folha" id="detalhe"></article>
</dialog>

<!-- CARIMBO -->
<div id="carimbo" class="carimbo" hidden>
  <img src="assets/selo.webp" alt="">
  <p id="carimbo-texto">Missão pregada no quadro</p>
</div>

<img id="pena" class="pena" src="assets/pena.webp" alt="" aria-hidden="true">

<script src="app.js" type="module"></script>
</body>
</html>
